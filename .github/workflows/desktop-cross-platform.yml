name: Desktop cross-platform

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            6.0.x
      - name: Build
        run: dotnet build RTXSandbox.csproj -c Release
      - name: Shared core tests
        run: dotnet run --project RTXSandbox.csproj -c Release --no-build -- --self-test

  publish-rids:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x86, win-x64, win-arm64, linux-x64, linux-arm64, linux-arm, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Publish ${{ matrix.rid }}
        shell: pwsh
        run: >-
          dotnet publish RTXSandbox.csproj -c Release -r ${{ matrix.rid }}
          --self-contained false -p:RTXSandboxManagedPublish=true
          -o artifacts/${{ matrix.rid }}/Managed
      - uses: actions/upload-artifact@v5
        with:
          name: rtxsandbox-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}

  android:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - android-arm64
          - android-arm
          - android-x64
          - android-x86
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Install Android workload
        run: dotnet workload install android
      - name: Detect Android SDK
        id: android-sdk
        shell: pwsh
        run: |
          $candidates = @(
            $env:ANDROID_HOME,
            $env:ANDROID_SDK_ROOT,
            "$env:LOCALAPPDATA\Android\Sdk",
            "$env:USERPROFILE\AppData\Local\Android\Sdk",
            "C:\Android\android-sdk",
            "C:\Users\runneradmin\AppData\Local\Android\Sdk"
          )
          $sdkRoot = $candidates | Where-Object { -not [string]::IsNullOrWhiteSpace($_) -and (Test-Path $_) } | Select-Object -First 1
          if ($null -eq $sdkRoot) {
            throw "Android SDK not detected. The Android matrix cannot produce an APK."
          }
          "path=$sdkRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "ANDROID_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Build Android APK for multiple ABIs
        shell: pwsh
        run: >-
          dotnet publish RTXSandbox.Android/RTXSandbox.Android.csproj -c Release
          -f net9.0-android -r ${{ matrix.rid }}
          -p:AndroidPackageFormat=apk
          -p:AndroidSdkDirectory=$env:ANDROID_SDK_ROOT
          -p:JAVASdkDirectory=$env:JAVA_HOME
          -o artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v5
        with:
          name: rtxsandbox-android-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
